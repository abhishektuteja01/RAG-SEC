# Runs the API tests, then replays the stored rerank scores and fails unless test recall@10
# is exactly 0.831.
# No GPU, no database, no API key. Needs network: the question set comes from Hugging Face.
name: ci

on:
  push:
  pull_request:

env:
  UV_VERSION: "0.12.1"

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Sync locked deps, CPU torch
        # Exported and pip-installed rather than `uv sync`: --torch-backend exists on
        # `uv pip install` only (uv 0.12.1), and without it Linux pulls the CUDA torch wheel.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.txt
          uv venv
          UV_TORCH_BACKEND=cpu uv pip install -r requirements.txt
      - name: Every module imports
        env:
          PYTHONPATH: src
        run: |
          .venv/bin/python -c "import rag_sec.api, rag_sec.answer, rag_sec.eval, rag_sec.dataset, rag_sec.retrieve"
      - name: API tests (retrieval and Gemini faked)
        env:
          PYTHONPATH: src
        run: |
          uv export --frozen --only-group dev --no-hashes -o dev-requirements.txt
          uv pip install -r dev-requirements.txt
          .venv/bin/python -m pytest -q tests
      - name: Replay test recall@10
        run: .venv/bin/python scripts/evaluate.py --replay --split test --out replay.json
      - name: Assert recall@10 == 0.831 on n=1545
        run: |
          .venv/bin/python - <<'PY'
          import json
          r = json.load(open("replay.json"))
          got, n = round(r["recall_10"]["mean"], 3), r["n_scored"]
          print(f"recall@10 {got}  n={n}")
          assert n == 1545, f"expected 1545 scored questions, got {n}"
          assert got == 0.831, f"expected recall@10 0.831, got {got}"
          PY
