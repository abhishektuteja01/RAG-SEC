[project]
name = "rag-sec"
version = "0.2.0"
description = "Retrieval-augmented QA over SEC 10-K filings: dense + BM25/RRF + cross-encoder rerank"
readme = "README.md"
authors = [
    { name = "Abhishek Tuteja", email = "69643534+abhishektuteja01@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.0",
    "google-genai>=2.21.0",
    "huggingface-hub==1.28.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.2,<3.0.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    # api.py imports BaseModel/Field directly, so it is declared rather than inherited.
    "pydantic>=2.9.0",
    # These decide what the search models compute: pinned exactly so a routine
    # `uv lock --upgrade` cannot silently move the scores.
    "sentence-transformers==6.0.0",
    "torch>=2.13.0",
    "transformers==5.8.1",
    "uvicorn[standard]>=0.40.0",
]

# Only for scripts/rebuild/ (EDGAR fetch + 10-K parsing). `uv run --extra rebuild ...`
[project.optional-dependencies]
rebuild = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "sec-parser==0.58.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
