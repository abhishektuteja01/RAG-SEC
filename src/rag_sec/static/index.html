<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG-SEC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M10 7h9l4 4v14H10z' fill='white'/%3E%3Cpath d='M13 15h7M13 18.5h7M13 22h4' stroke='%232f5bd3' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --text: #1c1c1a; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f5bd3; --accent-soft: #e9eefc; --on-accent: #fff; --ok: #1f8a4c; --warn: #9a6a00;
    --err: #b3261e; --mark: #fff0a8;
    --radius: 14px; --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #34342f;
      --accent: #7d9cff; --accent-soft: #252c44; --on-accent: #0f1530; --ok: #5ccf8b;
      --warn: #e0b04a; --err: #ff8a80; --mark: #5a4a12;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 1rem; }

  header, footer { flex: none; }
  header { text-align: center; padding: 1.8rem 0 .6rem; position: relative; }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
  header p { margin: .15rem 0 0; color: var(--muted); font-size: .92rem; }
  #clear {
    position: absolute; right: 1rem; top: 1.9rem; border: 1px solid var(--line);
    background: var(--card); border-radius: 8px; padding: .25rem .6rem; font-size: .8rem;
    color: var(--muted);
  }
  #clear:hover { color: var(--text); }

  #banner {
    display: none; margin: .4rem auto 0; padding: .5rem .9rem; border-radius: 10px;
    background: var(--accent-soft); font-size: .88rem; text-align: center; width: fit-content;
  }
  #banner.show { display: block; }
  #banner.bad { color: var(--err); }

  main { flex: 1; overflow-y: auto; }
  main > .wrap { min-height: 100%; display: flex; flex-direction: column; }
  #log { display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0 1.5rem; }
  #empty { text-align: center; color: var(--muted); margin: auto 0 10vh; }
  #empty svg { width: 52px; height: 52px; margin-bottom: .6rem; }
  #empty strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: .3rem; }

  .q {
    align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--on-accent);
    padding: .6rem .9rem; border-radius: var(--radius) var(--radius) 4px var(--radius);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1rem 1.1rem;
  }
  .fade { animation: fade .35s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* progress */
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; align-items: center; gap: .6rem; padding: .18rem 0; color: var(--muted); }
  .steps li .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  .steps li.now { color: var(--text); font-weight: 500; }
  .steps li.now .dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  .steps li.done { color: var(--text); }
  .steps li.done .dot { border-color: var(--ok); background: var(--ok); position: relative; }
  .steps li.done .dot::after {
    content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
    border: solid var(--card); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .note { color: var(--muted); font-weight: 400; font-size: .85rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .clock { display: flex; justify-content: space-between; margin-top: .7rem; font-size: .85rem; color: var(--muted); }
  .clock b { color: var(--text); font-variant-numeric: tabular-nums; }
  .quip { margin-top: .35rem; font-size: .85rem; font-style: italic; color: var(--muted); transition: opacity .3s; }

  /* answer */
  .value { font-size: 1.9rem; font-weight: 650; line-height: 1.2; margin-bottom: .4rem; overflow-wrap: anywhere; }
  .value small { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card.refused { border-style: dashed; }
  .card.refused .value { font-size: 1.15rem; color: var(--warn); }
  .explain { overflow-wrap: anywhere; }
  .explain p { margin: 0 0 .5rem; }
  .explain ul { margin: 0 0 .5rem; padding-left: 1.3rem; }
  .explain.writing > :last-child::after {
    content: ""; display: inline-block; width: .5em; height: 1em; margin-left: 2px;
    vertical-align: -.12em; background: var(--accent); animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking {
    height: .9rem; border-radius: 6px; margin: .35rem 0; width: 100%;
    background: linear-gradient(90deg, var(--line) 0%, var(--accent-soft) 50%, var(--line) 100%);
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
  }
  .thinking + .thinking { width: 70%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: 0 0; } }
  .status { font-size: .82rem; color: var(--muted); margin-top: .3rem; font-variant-numeric: tabular-nums; }
  .err { color: var(--err); }
  .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .8rem; }
  .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: .2rem; }
  .chip {
    border: 1px solid var(--line); background: transparent; border-radius: 999px;
    padding: .15rem .65rem; font-size: .82rem; transition: background .15s, border-color .15s;
  }
  .chip:hover, .chip[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .chip.hit::before { content: "●"; color: var(--ok); margin-right: .35rem; font-size: .7em; vertical-align: .1em; }
  .link { background: none; border: none; padding: .15rem .3rem; font-size: .82rem; color: var(--accent); }
  .source {
    margin-top: .5rem; border-left: 3px solid var(--accent); background: var(--bg);
    border-radius: 0 8px 8px 0; padding: .6rem .8rem; font-size: .85rem;
  }
  .source pre { margin: 0 0 .4rem; white-space: pre-wrap; font: inherit; max-height: 260px; overflow: auto; }
  .source a { color: var(--accent); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  table.times { border-collapse: collapse; font-size: .82rem; margin-top: .4rem; font-variant-numeric: tabular-nums; }
  table.times td { padding: .05rem 1rem .05rem 0; }
  table.times td:last-child { text-align: right; }

  /* composer */
  footer { border-top: 1px solid var(--line); background: var(--bg); padding: .8rem 0 .9rem; position: relative; }
  #jump {
    position: absolute; left: 50%; top: -3rem; transform: translateX(-50%);
    border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow);
    border-radius: 999px; padding: .3rem .9rem; font-size: .85rem;
  }
  #samples {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem;
    max-width: 560px; margin: 0 auto .6rem;
  }
  #samples .chip { background: var(--card); padding: .35rem .8rem; }
  form {
    display: flex; gap: .5rem; align-items: flex-end; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem .4rem .4rem .9rem;
    box-shadow: var(--shadow); transition: border-color .15s;
  }
  form:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent; color: inherit;
    font: inherit; padding: .35rem 0; max-height: 180px; height: 2.2rem;
  }
  #send {
    border: none; background: var(--accent); color: var(--on-accent); border-radius: 10px;
    padding: .45rem 1rem; font-weight: 600; transition: opacity .15s;
  }
  #send:disabled, #samples .chip:disabled { opacity: .45; cursor: default; }
  .hint { text-align: center; font-size: .78rem; color: var(--muted); margin-top: .4rem; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 .3rem; font: inherit; font-size: .9em; }

  @media (max-width: 560px) {
    #clear { position: static; margin-top: .5rem; }
    #samples { grid-template-columns: 1fr; }
    .q { max-width: 92%; }
    .value { font-size: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="wrap">
  <h1>RAG-SEC</h1>
  <p>Ask questions about 799 SEC 10-K filings</p>
  <button id="clear" type="button" hidden>Clear chat</button>
  <div id="banner" role="status"></div>
</header>

<main id="scroller">
  <div class="wrap">
    <div id="log" aria-live="polite"></div>
    <div id="empty">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)"/>
        <path d="M10 7h9l4 4v14H10z" fill="var(--card)"/>
        <path d="M13 15h7M13 18.5h7M13 22h4" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <strong>Ask about a company's annual report</strong>
      Name the company and the year. Answers cite the filing passages they came from.
    </div>
  </div>
</main>

<footer>
  <button id="jump" type="button" hidden>Jump to latest ↓</button>
  <div class="wrap">
    <div id="samples"></div>
    <form id="f">
      <textarea id="q" rows="1" placeholder="e.g. What was Aon's total EBITDA in 2015?" aria-label="Question" required></textarea>
      <button id="send" type="submit">Ask</button>
    </form>
    <div class="hint">Each question stands alone: name the company and year every time. Press <kbd>/</kbd> to type.</div>
  </div>
</footer>

<script>
// Test-set questions whose right passage the served pipeline ranks first.
const SAMPLES = [
  ["Aon · 2015 EBITDA", "What was Aon's total EBITDA for the year ended December 31, 2015?"],
  ["Emerson · 2016 total debt", "What was the total debt of Emerson Electric in 2016?"],
  ["Apple · 2005 inventory share", "What percentage of Apple Inc.'s total working capital in 2005 was comprised of inventory?"],
  ["JPMorgan · 2014 repurchase liability", "What was the repurchase liability for JPMorgan Chase at the end of 2014?"],
];
const STEPS = [
  ["resolve", "Finding the company"],
  ["load_models", "Loading the models (once per server start, about 45 s)"],
  ["embed", "Turning the question into a search vector"],
  ["search", "Searching the filings (meaning + keywords)"],
  ["rerank", "Re-ranking the best passages"],
  ["generate", "Gemini is reading the passages"],
];
const TIMING_NAMES = {
  resolve_s: "Find company", embed_s: "Embed question", search_s: "Search",
  rerank_s: "Re-rank", mps_empty_cache_s: "Free GPU memory", total_s: "Retrieval total",
  generation_first_text_s: "Gemini first words", generation_s: "Gemini answer", end_to_end: "End to end",
};
const QUIPS = [
  "Squinting at footnotes…", "Reading the fine print so you don't have to…",
  "Asking the auditors nicely…", "Cross-checking the balance sheet…",
  "Ignoring the forward-looking statements…", "Bribing the reranker with GPU time…",
  "Flipping through Item 7…", "Counting in millions, not thousands…",
  "Politely skipping the risk factors…", "Following the money…",
];
const STORE_KEY = "rag-sec-chat-v1";
const MAX_SAVED = 30;
const TITLE = "RAG-SEC";

const $ = (id) => document.getElementById(id);
const log = $("log"), form = $("f"), input = $("q"), send = $("send"), jump = $("jump");
const scroller = $("scroller"), banner = $("banner"), empty = $("empty"), clearBtn = $("clear");
let busy = false, ready = false, stick = true;
let history = load();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function button(cls, text, onclick) {
  const b = el("button", cls, text);
  b.type = "button";
  b.onclick = onclick;
  return b;
}
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; }
}
function save() {
  history = history.slice(-MAX_SAVED);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(history)); } catch { /* storage full: keep in memory only */ }
  clearBtn.hidden = history.length === 0;
  empty.hidden = history.length > 0 || busy;
}

// ── scrolling: follow new content only while the reader is at the bottom ──
function atBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 60; }
scroller.addEventListener("scroll", () => { stick = atBottom(); if (stick) jump.hidden = true; });
function follow(force) {
  if (force) stick = true;
  if (stick) { scroller.scrollTop = scroller.scrollHeight; jump.hidden = true; }
  else jump.hidden = false;
}
jump.onclick = () => { scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" }); stick = true; jump.hidden = true; };

// ── tab title: say when an answer lands while the tab is in the background ──
function setTitle(state) {
  document.title = state === "busy" ? `Answering… · ${TITLE}`
    : state === "done" && document.hidden ? `✓ Answer ready · ${TITLE}` : TITLE;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy) setTitle(); });

// ── server readiness ─────────────────────────────────────────────
async function checkReady() {
  let msg = null, bad = false;
  try {
    const res = await fetch("/ready", { cache: "no-store" });
    if (!res.ok) { msg = "Database not ready: " + ((await res.json()).detail || res.status); bad = true; }
  } catch { msg = "Server is starting (loading models, about 45 s)…"; }
  ready = !msg;
  banner.textContent = msg || "";
  banner.className = msg ? "show" + (bad ? " bad" : "") : "";
  setBusy(busy);
  if (!ready) setTimeout(checkReady, 3000);
}

// ── text helpers ─────────────────────────────────────────────────
function stemParts(stem) {
  const [ticker, year, cik] = stem.split("_");
  return { ticker, year, cik };
}

function splitAnswer(text) {
  const m = text.match(/^\s*ANSWER\s*:\s*(.+?)\s*$/im);
  const explain = m ? (text.slice(0, m.index) + text.slice(m.index + m[0].length)).trim() : text.trim();
  return { headline: m ? m[1] : null, explain };
}

// While streaming, hide the ANSWER line, including a half-written one ("ANS").
function hideAnswerLine(text) {
  const lines = text.split("\n");
  const last = lines[lines.length - 1];
  if (/^\s*a(n(s(w(e(r(\s*:.*)?)?)?)?)?)?$/i.test(last)) lines.pop();
  return lines.filter((l) => !/^\s*ANSWER\s*:/i.test(l)).join("\n");
}

// Only what Gemini's answers use: paragraphs, "-"/"*" bullets, **bold**, simple LaTeX.
// Built from text nodes, never innerHTML, so model output cannot inject markup.
function plainMath(s) {
  return s.replace(/\$\$|\\\(|\\\)|\\\[|\\\]/g, "").replace(/\$(\\[^$]*)\$/g, "$1")
    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "$1 ÷ $2")
    .replace(/\\times/g, "×").replace(/\\approx/g, "≈").replace(/\\%/g, "%")
    .replace(/\\text\{([^{}]*)\}/g, "$1");
}
function inline(parent, text) {
  plainMath(text).split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
    if (part) parent.appendChild(i % 2 ? el("strong", null, part) : document.createTextNode(part));
  });
}
function renderMarkdown(text) {
  const frag = document.createDocumentFragment();
  let list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const bullet = line.match(/^[-*•]\s+(.*)/);
    if (bullet) {
      if (!list) list = frag.appendChild(el("ul"));
      inline(list.appendChild(el("li")), bullet[1]);
      continue;
    }
    list = null;
    if (line) inline(frag.appendChild(el("p")), line);
  }
  return frag;
}

// The answer's number as a pattern that also matches it written with or without thousands
// commas ("2,505" finds "2505"). Single digits are skipped: they would match everywhere.
function numberPattern(headline) {
  const m = headline && headline.match(/\d[\d,]*(?:\.\d+)?/);
  if (!m) return null;
  const [int, dec] = m[0].replace(/,/g, "").split(".");
  if (int.length < 2 && !dec) return null;
  const intPat = int.replace(/\B(?=(\d{3})+(?!\d))/g, ",").split(",").join(",?");
  const tail = dec ? `\\.${dec}(?!\\d)` : "(?![\\d]|[.,]\\d)";
  return new RegExp(`(?<![\\d.,])${intPat}${tail}`, "g");
}
function highlighted(text, re) {
  const frag = document.createDocumentFragment();
  if (!re) { frag.append(text); return frag; }
  let at = 0;
  for (const m of text.matchAll(re)) {
    frag.append(text.slice(at, m.index), el("mark", null, m[0]));
    at = m.index + m[0].length;
  }
  frag.append(text.slice(at));
  return frag;
}

// ── answer card: sources first, then streamed text, then the final answer ──
function answerCard() {
  const card = el("div", "card fade");
  const valueSlot = el("div");
  const explain = el("div", "explain");
  explain.append(el("div", "thinking"), el("div", "thinking"));
  const status = el("div", "status", "Gemini is reading the passages…");
  const sourcesSlot = el("div");
  const actions = el("div");
  card.append(valueSlot, explain, status, sourcesSlot, actions);

  let citations = [], re = null, openCitation = null;
  let received = "", shown = 0, frame = null, finishing = null;

  function renderSources() {
    sourcesSlot.textContent = "";
    if (!citations.length) return;
    const row = el("div", "row");
    row.appendChild(el("span", "label", "Sources"));
    const panel = el("div");
    const chips = citations.map((c, i) => {
      const { ticker, year } = stemParts(c.filing_stem);
      const hit = re && c.text && new RegExp(re.source).test(c.text);
      const chip = button("chip" + (hit ? " hit" : ""), `${ticker} · ${year} · #${c.chunk_index}`, () => {
        openCitation = openCitation === c ? null : c;
        chips.forEach((x) => x.setAttribute("aria-expanded", "false"));
        panel.textContent = "";
        if (openCitation) { chip.setAttribute("aria-expanded", "true"); panel.appendChild(sourcePanel(c, re)); }
      });
      chip.title = `${c.filing_stem} chunk ${c.chunk_index}, reranker score ${c.score.toFixed(3)}`
        + (hit ? " · contains the answer's number" : "");
      chip.setAttribute("aria-expanded", String(openCitation === c));
      if (i >= 3) chip.hidden = true;
      row.appendChild(chip);
      return chip;
    });
    if (citations.length > 3) {
      const more = button("link", `show all ${citations.length}`, () => {
        chips.forEach((c) => (c.hidden = false));
        more.remove();
      });
      row.appendChild(more);
    }
    if (openCitation) panel.appendChild(sourcePanel(openCitation, re));
    sourcesSlot.append(row, panel);
  }

  // Gemini sends text in bursts of a sentence or more; reveal it at a steady pace instead,
  // faster when more is waiting, so it reads like typing. Pacing only: no text is invented.
  function reveal() {
    const backlog = received.length - shown;
    if (backlog > 0) {
      shown += Math.max(2, Math.ceil(backlog / 12));
      explain.textContent = "";
      explain.appendChild(renderMarkdown(hideAnswerLine(received.slice(0, shown))));
      follow();
    }
    if (shown < received.length) frame = requestAnimationFrame(reveal);
    else { frame = null; if (finishing) finishing(); }
  }

  return {
    card,
    sources(cs) { citations = cs; renderSources(); follow(); },
    text(piece) {
      if (!received) { explain.textContent = ""; explain.classList.add("writing"); status.textContent = "Writing…"; }
      received += piece;
      if (!frame) frame = requestAnimationFrame(reveal);
    },
    // Resolves once the typing animation has caught up, then draws the final state.
    finish(data) {
      return new Promise((resolve) => {
        finishing = () => { finishing = null; draw(data); resolve(); };
        if (!frame) finishing();
      });
    },
    fail(message, retry) {
      if (frame) cancelAnimationFrame(frame);
      explain.classList.remove("writing");
      status.remove();
      if (!received) explain.textContent = "";
      explain.appendChild(el("p", "err", message));
      if (retry) actions.appendChild(el("div", "row")).appendChild(button("link", "Try again", retry));
    },
  };

  function draw(data) {
    const { headline, explain: body } = splitAnswer(data.answer);
    const refused = data.value_status === "refused";
    card.classList.toggle("refused", refused);
    valueSlot.textContent = "";
    if (refused) {
      valueSlot.appendChild(el("div", "value", "Not enough evidence in the retrieved passages"));
    } else if (headline && data.value_status === "ok") {
      const v = el("div", "value fade");
      v.appendChild(el("small", null, "Answer"));
      v.appendChild(document.createTextNode(headline));
      valueSlot.appendChild(v);
      re = numberPattern(headline);
    }
    explain.classList.remove("writing");
    explain.textContent = "";
    explain.appendChild(renderMarkdown(body));
    status.remove();
    citations = data.citations;
    renderSources();

    actions.textContent = "";
    const row = el("div", "row");
    const copy = button("link", "Copy answer", async () => {
      try { await navigator.clipboard.writeText(data.answer); copy.textContent = "Copied ✓"; }
      catch { copy.textContent = "Copy failed"; }
      setTimeout(() => (copy.textContent = "Copy answer"), 1500);
    });
    const times = el("table", "times");
    times.hidden = true;
    const rows = Object.entries(data.stage_latency).concat([["end_to_end", data.latency_s]]);
    for (const [k, secs] of rows) {
      const tr = el("tr");
      tr.append(el("td", null, TIMING_NAMES[k] || k), el("td", null, Number(secs).toFixed(2) + " s"));
      times.appendChild(tr);
    }
    const det = button("link", `Details · ${data.latency_s.toFixed(1)} s`, () => { times.hidden = !times.hidden; follow(); });
    row.append(copy, det);
    actions.append(row, times);
  }
}

function sourcePanel(c, re) {
  const { ticker, year, cik } = stemParts(c.filing_stem);
  const box = el("div", "source fade");
  box.appendChild(el("pre")).appendChild(highlighted(c.text || "(no text)", re));
  const a = el("a", null, `${ticker} 10-K filings on SEC EDGAR ↗`);
  a.href = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${encodeURIComponent(cik)}&type=10-K`;
  a.target = "_blank"; a.rel = "noopener";
  box.appendChild(a);
  box.appendChild(el("span", "note", `  ·  ${year} filing, chunk ${c.chunk_index}, score ${c.score.toFixed(3)}`));
  return box;
}

function errorCard(message, retry) {
  const card = el("div", "card fade");
  card.appendChild(el("div", "err", message));
  if (retry) card.appendChild(el("div", "row")).appendChild(button("link", "Try again", retry));
  return card;
}

function renderEntry(entry) {
  log.appendChild(el("div", "q", entry.question));
  if (entry.data) {
    const a = answerCard();
    a.card.classList.remove("fade");
    log.appendChild(a.card);
    a.finish(entry.data);
  } else {
    log.appendChild(errorCard(entry.error, () => ask(entry.question)));
  }
}

// ── progress card ────────────────────────────────────────────────
function progressCard() {
  const card = el("div", "card fade");
  const list = el("ul", "steps");
  const items = {};
  for (const [key, label] of STEPS) {
    const li = el("li");
    li.appendChild(el("span", "dot"));
    const text = el("span", null, label);
    li.appendChild(text);
    if (key === "load_models") li.hidden = true;
    items[key] = { li, text };
    list.appendChild(li);
  }
  card.appendChild(list);
  const clock = el("div", "clock");
  const elapsed = el("b", null, "0.0 s");
  const left = el("span");
  left.append("Elapsed ", elapsed);
  const last = Number(localStorage.getItem("rag-sec-last-s"));
  clock.append(left, el("span", null, last ? `last question took ${last.toFixed(0)} s` : "usually about 30 s on a Mac"));
  card.appendChild(clock);
  const pick = () => QUIPS[Math.floor(Math.random() * QUIPS.length)];
  const quip = el("div", "quip", pick());
  card.appendChild(quip);

  const t0 = performance.now();
  const tick = setInterval(() => (elapsed.textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s"), 100);
  const spin = setInterval(() => {
    quip.style.opacity = 0;
    setTimeout(() => { quip.textContent = pick(); quip.style.opacity = 1; }, 300);
  }, 3500);

  let current = null;
  return {
    card,
    stage(name, info) {
      const item = items[name];
      if (!item) return;
      if (current) { current.li.classList.remove("now"); current.li.classList.add("done"); }
      item.li.hidden = false;
      item.li.classList.add("now");
      current = item;
      if (name === "embed") {
        const found = info.tickers && info.tickers.length ? `found ${info.tickers.join(", ")}` : "no company named, searching all";
        items.resolve.text.appendChild(el("span", "note", ` — ${found}`));
      }
      if (name === "rerank" && info.candidates) item.text.appendChild(el("span", "note", ` — ${info.candidates} passages`));
    },
    stop() { clearInterval(tick); clearInterval(spin); card.remove(); },
  };
}

// ── asking ───────────────────────────────────────────────────────
async function* sseEvents(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, i);
      buf = buf.slice(i + 2);
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      yield { event, data: JSON.parse(data) };
    }
  }
}

function friendlyError(status, detail) {
  if (status === 429) return detail;
  if (status === 404) return "No passages found for that question. Try naming the company and year.";
  if (status === 422) return "That question couldn't be sent (it may be empty or over 2,000 characters).";
  return `Something went wrong (${status}): ${detail}`;
}

async function ask(question) {
  question = question.trim();
  if (busy || !question) return;
  setBusy(true);
  setTitle("busy");
  empty.hidden = true;
  log.appendChild(el("div", "q fade", question));
  const prog = progressCard();
  log.appendChild(prog.card);
  follow(true);

  const entry = { question };
  let answer = null;
  const retry = () => ask(question);
  try {
    const res = await fetch("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, include_text: true }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw Object.assign(new Error(), { status: res.status, detail: JSON.stringify(body.detail ?? body) });
    }
    for await (const { event, data } of sseEvents(res)) {
      if (event === "stage") prog.stage(data.stage, data);
      else if (event === "sources") {
        answer = answerCard();
        log.appendChild(answer.card);
        answer.sources(data.citations);
      } else if (event === "text") {
        if (prog.card.isConnected) prog.stop();
        answer.text(data.text);
      } else if (event === "answer") entry.data = data;
      else if (event === "error") entry.error = friendlyError(data.status, data.detail);
    }
    if (!entry.data && !entry.error) entry.error = "The server closed the connection before answering.";
  } catch (err) {
    entry.error = err.status ? friendlyError(err.status, err.detail)
      : "Couldn't reach the server. Is it running? (" + err.message + ")";
    if (!err.status) checkReady();
  }

  prog.stop();
  if (entry.data) {
    localStorage.setItem("rag-sec-last-s", entry.data.latency_s);
    if (!answer) { answer = answerCard(); log.appendChild(answer.card); }
    await answer.finish(entry.data);
  } else if (answer) {
    answer.fail(entry.error, retry);
  } else {
    log.appendChild(errorCard(entry.error, retry));
  }
  history.push(entry);
  setBusy(false);
  setTitle("done");
  save();
  follow();
  input.focus();
}

function setBusy(b) {
  busy = b;
  send.disabled = b || !ready;
  document.querySelectorAll("#samples .chip").forEach((c) => (c.disabled = b || !ready));
}

// ── wiring ───────────────────────────────────────────────────────
for (const [label, question] of SAMPLES) {
  const chip = button("chip", label, () => ask(question));
  chip.title = question;
  $("samples").appendChild(chip);
}
function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", grow);
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); form.requestSubmit(); }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && !/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) { ev.preventDefault(); input.focus(); }
});
form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (send.disabled) return;
  const q = input.value;
  input.value = "";
  grow();
  ask(q);
});
clearBtn.onclick = () => { history = []; log.textContent = ""; save(); };

history.forEach(renderEntry);
save();
follow(true);
checkReady();
input.focus();
</script>
</body>
